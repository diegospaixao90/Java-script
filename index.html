<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <script src="scripts.js" defer></script>
    <title>Conversor de Moedas</title>
</head>

<body>

    <img class="logo-topo" src="Design sem nome.gif" alt="logo">

    <main>
        <label>
            Converte <b>De:</b>
            <select class="currency-select-value">
                <option value="real-r">R$: Real Brasileiro</option>
                <option value="dolar-d">US$: Dólar Americano</option>
                <option value="euro-e">€: Euro</option>
                <option value="yuan-y">¥: Yuan Chinês</option>
                <option value="bitcoin-b">₿: Bitcoin</option>
                <option value="libra-l">£: Libra</option>
            </select>

            <label>
                Converte <b>Para:</b>
                <select class="currency-select">

                    <option value="dolar">US$: Dólar Americano</option>
                    <option value="euro">€: Euro</option>
                    <option value="yuan">¥: Yuan Chinês</option>
                    <option value="bitcoin">₿: Bitcoin</option>
                    <option value="libra">£: Libra</option>
                    <option value="real">R$: Real Brasileiro</option>


                </select>
            </label>

            <label>
                Valor:
                <input class="valor-moeda" placeholder="10.000,00">
            </label>

            <button class="convert-button">Converter</button>


            <section>
                <div class="bamdeiras">
                    <img src="acetes/assets/real.png" alt="logo real">
                    <p class="moeda">Real</p>
                    <p class="moeda-aconverter">R$: 00,00</p>
                </div>

                <img class="seta" src="acetes/assets/Vector.png" alt="seta">

                <div class="bamdeiras">
                    <img class="logo-img" src="acetes/assets/dola.png" alt="logo dola">
                    <p class="moeda" id="nova-moeda">Dólar Americano</p>
                    <p class="moeda-valor">US$: 00,00</p>
                </div>
            </section>


    </main>

</body>

</html>
